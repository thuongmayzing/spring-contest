<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Progress Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #1e2447; --accent: #f4c542; --success: #2ecc71; }
  * { box-sizing: border-box; }
  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; background: transparent; 
    display: flex; justify-content: center; align-items: center; 
    height: 100vh; overflow: hidden; 
  }

  .container { 
    width: 100%; max-width: 340px; 
    background: white; border-radius: 16px; 
    display: flex; flex-direction: column; 
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    border: 1px solid #eee;
  }

  /* Compact Login */
  .email-box { padding: 20px; text-align: center; }
  .email-box input { 
    padding: 10px; border-radius: 8px; border: 1px solid #ddd; 
    width: 100%; margin-bottom: 10px; font-family: inherit; 
  }
  .email-box button { 
    background: var(--primary); color: white; border: none; 
    border-radius: 8px; padding: 10px; width: 100%; 
    font-weight: 700; cursor: pointer; font-family: inherit;
  }

  /* Compact Widget */
  #widget { display: none; flex-direction: column; }
  
  .header { 
    background: var(--primary); color: white; 
    padding: 12px; text-align: center; border-radius: 16px 16px 0 0; 
  }
  .header h1 { margin: 0; font-size: 16px; text-transform: uppercase; }
  .level-badge { 
    background: var(--accent); color: var(--primary); 
    padding: 2px 12px; border-radius: 10px; 
    font-weight: 800; font-size: 11px; margin-top: 4px; display: inline-block;
  }

  .content { padding: 12px; text-align: center; }

  .circle { 
    width: 110px; height: 110px; 
    border: 5px solid var(--accent); border-radius: 50%; 
    margin: 0 auto 12px; display: flex; flex-direction: column; 
    justify-content: center; align-items: center; 
  }
  .circle span { font-size: 8px; color: #999; text-transform: uppercase; }
  .circle .units { font-size: 14px; font-weight: 800; color: var(--primary); }
  .circle .reward { font-size: 15px; font-weight: 800; color: var(--success); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .stat-box { background: #f8f9fb; padding: 6px 2px; border-radius: 8px; border: 1px solid #f0f0f0; }
  .stat-box small { font-size: 8px; color: #aaa; text-transform: uppercase; font-weight: 700; }
  .stat-box span { font-size: 12px; font-weight: 800; color: var(--primary); }

  .progress-container { background: #eee; border-radius: 10px; height: 18px; overflow: hidden; position: relative; }
  .progress-bar { 
    height: 100%; background: #3c4b8e; width: 0%; 
    transition: width 1s; display: flex; align-items: center; justify-content: center; 
  }
  .progress-bar-text { color: white; font-size: 10px; font-weight: 800; }

  .footer-info { display: flex; justify-content: space-between; margin-top: 5px; font-size: 9px; color: #888; font-weight: 700; }
  .footer { 
    font-size: 9px; padding: 8px; color: #bbb; 
    text-align: center; border-top: 1px solid #f5f5f5; 
  }
</style>
</head>
<body>

<div class="container">
  <div class="email-box" id="email-box">
    <input type="text" placeholder="User ID" id="userIdInput">
    <button id="submitBtn" onclick="loadWidget()">Check Progress</button>
  </div>

  <div id="widget">
    <div class="header">
      <h1>Spring Contest</h1>
      <div class="level-badge" id="level-text">LEVEL 0</div>
    </div>

    <div class="content">
      <div class="circle">
        <span>Next Reward</span>
        <div class="units" id="next-goal">---</div>
        <div class="reward" id="next-reward">---</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><small>Units</small><br><span id="stat-units">0</span></div>
        <div class="stat-box"><small>Points</small><br><span id="stat-points">0</span></div>
        <div class="stat-box"><small>Rank</small><br><span id="stat-rank">0</span></div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-bar">
          <span class="progress-bar-text" id="progress-pct">0%</span>
        </div>
      </div>
      <div class="footer-info">
        <div id="progress-text">0/0 pts</div>
        <div id="time-left">⏰ --d</div>
      </div>
    </div>
    <div class="footer">ID: <span id="user-email"></span></div>
  </div>
</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbynbUNjQvYahFZ7kFAuelON1dAEb1EpadQgZY1WQgGJdbgqJLnA8oOZY78jKYNU-pF0uQ/exec";

async function loadWidget() {
  const userId = document.getElementById("userIdInput").value.trim();
  if (!userId) return;
  const btn = document.getElementById("submitBtn");
  btn.textContent = "...";
  
  try {
    const res = await fetch(apiUrl + "?id=" + encodeURIComponent(userId));
    const data = await res.json();
    if (data.error) { alert("Not found"); btn.textContent="Check Progress"; return; }
    document.getElementById("email-box").style.display = "none";
    document.getElementById("widget").style.display = "flex";
    renderData(data);
  } catch (err) { btn.textContent="Check Progress"; }
}

function renderData(data) {
  const points = Number(data.points) || 0;
  document.getElementById("user-email").textContent = data.id || data.email || "N/A";
  document.getElementById("stat-units").textContent = (data.units || 0).toLocaleString();
  document.getElementById("stat-points").textContent = points.toLocaleString();
  document.getElementById("stat-rank").textContent = "#" + (data.rank || 0);

  const levels = [
    { p: 1000, r: "$200" }, { p: 2000, r: "$500" }, { p: 5000, r: "$1,500" },
    { p: 10000, r: "$3,500" }, { p: 25000, r: "$10,000" }, { p: 50000, r: "$25,000" }, { p: 150000, r: "$100,000" }
  ];

  let lvl = 0;
  levels.forEach((l, i) => { if (points >= l.p) lvl = i + 1; });
  document.getElementById("level-text").textContent = `LEVEL ${lvl}`;

  const next = levels.find(l => l.p > points) || levels[levels.length-1];
  document.getElementById("next-goal").textContent = next.p.toLocaleString();
  document.getElementById("next-reward").textContent = next.r;

  const pct = Math.floor(Math.min(100, (points / next.p) * 100));
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("progress-text").textContent = `${points.toLocaleString()}/${next.p.toLocaleString()}`;

  const days = Math.max(0, Math.ceil((new Date("2026-06-24T23:59:59Z") - new Date()) / 864e5));
  document.getElementById("time-left").textContent = `⏰ ${days}d`;
}
</script>
</body>
</html>
