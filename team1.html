<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Individual Progress - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #1e2447; --accent: #f4c542; --bg: #f7f8fc; --success: #2ecc71; }
  
  /* Reset & Fit Screen */
  * { box-sizing: border-box; }
  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; 
    background: var(--bg); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; /* Cố định chiều cao màn hình */
    overflow: hidden; /* Không cho scroll */
  }

  .container { 
    width: 100%; 
    max-width: 400px; 
    height: 95vh; /* Fit vừa chiều dọc */
    background: white; 
    border-radius: 24px; 
    display: flex; 
    flex-direction: column; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    position: relative;
  }

  /* Form nhập ID */
  .email-box { 
    flex: 1;
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    padding: 20px; 
    gap: 15px; 
  }
  .email-box input { padding: 15px; border-radius: 12px; border: 1.5px solid #eee; width: 90%; font-size: 16px; outline: none; font-family: inherit; transition: 0.3s; }
  .email-box input:focus { border-color: var(--primary); }
  .email-box button { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 15px; font-weight: 700; cursor: pointer; width: 90%; font-family: inherit; font-size: 16px; }

  /* Widget Content */
  #widget { display: none; height: 100%; display: none; flex-direction: column; }
  
  .header { background: var(--primary); color: white; text-align: center; padding: 25px 20px 15px; border-radius: 24px 24px 0 0; }
  .header h1 { margin: 0; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .header p { font-size: 11px; opacity: 0.7; margin: 5px 0; }
  .level-badge { background: var(--accent); color: var(--primary); padding: 4px 20px; border-radius: 20px; font-weight: 800; display: inline-block; margin-top: 5px; font-size: 14px; }

  .content { padding: 20px 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }

  .circle { 
    width: 160px; height: 160px; 
    border: 8px solid var(--accent); 
    border-radius: 50%; 
    margin: 0 auto; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    background: #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  }
  .circle .units { font-size: 20px; font-weight: 800; color: var(--primary); margin: 3px 0; }
  .circle .reward { font-size: 18px; font-weight: 700; color: var(--success); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
  .stat-box { background: #f9fafc; padding: 10px 2px; border-radius: 12px; border: 1px solid #f0f0f0; }
  .stat-box small { font-size: 9px; color: #999; text-transform: uppercase; font-weight: 700; }
  .stat-box span { font-size: 15px; font-weight: 800; color: var(--primary); }

  .progress-section { width: 100%; }
  .progress-container { background: #eee; border-radius: 20px; height: 28px; overflow: hidden; width: 100%; position: relative; }
  .progress-bar { height: 100%; background: #3c4b8e; width: 0%; transition: width 1s ease; display: flex; align-items: center; justify-content: center; }
  .progress-bar-text { color: white; font-size: 13px; font-weight: 800; }

  .footer-info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: #777; font-weight: 700; }

  .footer { text-align: center; font-size: 11px; padding: 15px; color: #bbb; border-top: 1px solid #f2f2f2; background: #fafafa; border-radius: 0 0 24px 24px; }
</style>
</head>
<body>

<div class="container">
  <!-- Màn hình nhập ID -->
  <div class="email-box" id="email-box">
    <h2 style="color: var(--primary); margin: 0;">User Progress</h2>
    <p style="font-size: 13px; color: #666;">Nhập User ID để kiểm tra thứ hạng</p>
    <input type="text" placeholder="Enter your ID..." id="userIdInput">
    <button id="submitBtn" onclick="loadWidget()">View My Progress</button>
  </div>

  <!-- Màn hình chính (Widget) -->
  <div id="widget">
    <div class="header">
      <h1>Spring Contest</h1>
      <p>Mar 24 - Jun 24 (23:59 GMT)</p>
      <div class="level-badge" id="level-text">LEVEL 0</div>
    </div>

    <div class="content">
      <div class="circle">
        <span style="font-size:10px; color:#999; text-transform:uppercase; font-weight:700;">Next Reward</span>
        <div class="units" id="next-goal">---</div>
        <div class="reward" id="next-reward">---</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><small>Units</small><br><span id="stat-units">0</span></div>
        <div class="stat-box"><small>Points</small><br><span id="stat-points">0</span></div>
        <div class="stat-box"><small>Rank</small><br><span id="stat-rank">0</span></div>
      </div>

      <div class="progress-section">
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar">
            <span class="progress-bar-text" id="progress-pct">0%</span>
          </div>
        </div>
        <div class="footer-info">
          <div id="progress-text">0 / 0 points</div>
          <div id="time-left">⏰ Loading...</div>
        </div>
      </div>
    </div>

    <div class="footer">User ID: <span id="user-email" style="color: var(--primary); font-weight:700;"></span></div>
  </div>
</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbynbUNjQvYahFZ7kFAuelON1dAEb1EpadQgZY1WQgGJdbgqJLnA8oOZY78jKYNU-pF0uQ/exec";

async function loadWidget() {
  const userId = document.getElementById("userIdInput").value.trim();
  if (!userId) return alert("Please enter your User ID");

  const btn = document.getElementById("submitBtn");
  btn.textContent = "Fetching Data...";
  btn.disabled = true;

  try {
    const res = await fetch(apiUrl + "?id=" + encodeURIComponent(userId));
    const data = await res.json();
    
    if (data.error) { 
      alert("Error: " + data.error); 
      btn.textContent = "View My Progress";
      btn.disabled = false;
      return; 
    }

    document.getElementById("email-box").style.display = "none";
    document.getElementById("widget").style.display = "flex";
    renderData(data);
  } catch (err) { 
    console.error(err);
    alert("Connection error.");
    btn.textContent = "View My Progress";
    btn.disabled = false;
  }
}

function renderData(data) {
  const points = Number(data.points) || 0;
  const units = Number(data.units) || 0;
  const rank = Number(data.rank) || 0;

  document.getElementById("user-email").textContent = data.email || data.id || "N/A";
  document.getElementById("stat-units").textContent = units.toLocaleString();
  document.getElementById("stat-points").textContent = points.toLocaleString();
  document.getElementById("stat-rank").textContent = "#" + rank;

  const levels = [
    { points: 1000, reward: "$200" }, { points: 2000, reward: "$500" },
    { points: 5000, reward: "$1,500" }, { points: 10000, reward: "$3,500" },
    { points: 25000, reward: "$10,000" }, { points: 50000, reward: "$25,000" },
    { points: 150000, reward: "$100,000" }
  ];

  let currentLevel = 0;
  levels.forEach((l, i) => { if (points >= l.points) currentLevel = i + 1; });
  document.getElementById("level-text").textContent = `LEVEL ${currentLevel}`;

  const nextL = levels.find(l => l.points > points) || levels[levels.length-1];
  document.getElementById("next-goal").textContent = nextL.points.toLocaleString() + " Points";
  document.getElementById("next-reward").textContent = nextL.reward;

  // LOGIC CHUẨN: Lấy points hiện tại chia cho mốc đích tiếp theo
  const pct = Math.floor(Math.max(0, Math.min(100, (points / nextL.points) * 100)));
  
  const bar = document.getElementById("progress-bar");
  const pctLabel = document.getElementById("progress-pct");
  
  bar.style.width = pct + "%";
  pctLabel.textContent = pct + "%";

  document.getElementById("progress-text").textContent = 
    `${points.toLocaleString()} / ${nextL.points.toLocaleString()} pts`;
}

function updateTimer() {
  const end = new Date("2026-06-24T23:59:59Z");
  const now = new Date();
  const diff = end - now;
  const label = document.getElementById("time-left");
  if (!label) return;
  if (diff <= 0) return label.textContent = "Ended";
  const d = Math.floor(diff / 864e5);
  const h = Math.floor((diff % 864e5) / 36e5);
  label.textContent = `⏰ ${d}d ${h}h Left`;
}

setInterval(updateTimer, 60000);
updateTimer();
</script>
</body>
</html>
