<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #1e2447;
  --accent: #f4c542;
  --bg: #f7f8fc;
  --text-muted: #999;
}

body { 
  font-family: 'Montserrat', sans-serif; 
  margin: 0; 
  background: var(--bg); 
  display: flex; 
  justify-content: center; 
  align-items: center;
  min-height: 100vh; 
}

.container { 
  max-width: 480px; 
  width: 92%; 
  background: white; 
  border-radius: 24px; 
  overflow: hidden; 
  box-shadow: 0 12px 40px rgba(0,0,0,0.08); 
}

.login-box { 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  padding: 80px 20px; 
  gap: 15px; 
  text-align: center; 
}
.login-box h2 { color: var(--primary); font-weight: 800; }
.login-box input { padding: 15px; border-radius: 12px; border: 1px solid #ddd; width: 85%; }
.login-box button { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 15px; width: 92%; }

.header { background: var(--primary); color: white; text-align: center; padding: 45px 20px 35px; }
.header h1 { margin: 0; font-size: 32px; }

.content { padding: 30px 12px; }

.table-header, .row {
  display: grid;
  grid-template-columns: 45px 1.2fr 60px 80px;
  align-items: center;
}

.table-header {
  font-size: 10px;
  color: var(--text-muted);
  padding: 0 15px 12px;
}

.row {
  padding: 18px 15px;
  border-radius: 16px;
  border: 1px solid #f2f2f2;
  margin-bottom: 10px;
  background: #fff;
}

.row.top1 {
  background: #fffdf2;
  border-color: var(--accent);
  box-shadow: 0 4px 15px rgba(244,197,66,0.12);
}

.row.me {
  background: #eff2ff;
  border: 2px dashed #3d4da0;
  font-weight: 800;
}

.rank-col { justify-self: center; font-weight: 800; }
.name-col { justify-self: start; }
.level-col { justify-self: center; color: #2ecc71; font-weight: 700; }
.points-col { justify-self: end; font-weight: 700; }

#list-wrapper { display: none; }
.loading { text-align:center; padding:40px; color:#999; }
</style>
</head>

<body>

<div class="container">

<div class="login-box" id="login">
  <h2>Leaderboard</h2>
  <input type="text" id="userIdInput" placeholder="Enter your userID">
  <button onclick="start()">View Rankings</button>
</div>

<div id="list-wrapper">
  <div class="header">
    <h1>LEADERBOARD</h1>
  </div>

  <div class="content">

    <div class="table-header">
      <div>Rank</div>
      <div>Participant</div>
      <div style="text-align:center">Level</div>
      <div style="text-align:right">Points</div>
    </div>

    <div id="list">
      <div class="loading">Loading...</div>
    </div>

  </div>
</div>

</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbwQHZlinas13xJ3LgIDsvcYyff5DE9FJo2YodUxZxwHT5oPfoo-a-KgIvjnloTyBhu7cw/exec";

const ACCESS_EMAIL = "xngbusiness@gmail.com";
let currentUserId = "";

function start(){
  const userId = document.getElementById("userIdInput").value.trim();
  if(!userId) return alert("Enter userID");

  currentUserId = userId;
  document.getElementById("login").style.display = "none";
  document.getElementById("list-wrapper").style.display = "block";
  loadLeaderboard();
}

function loadLeaderboard(){
  const url = `${apiUrl}?email=${encodeURIComponent(ACCESS_EMAIL)}&callback=handleData`;
  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

window.handleData = function(data){
  if(data.error){
    document.getElementById("list").innerHTML = `<div style="color:red;text-align:center">${data.error}</div>`;
    return;
  }

  const list = data.leaderboard || [];

  // tìm YOU
  const me = list.find(u => u.userId === currentUserId);

  let html = list.slice(0,3).map(u => {
    const isMe = u.userId === currentUserId;

    return `
    <div class="row ${u.rank==1?'top1':''} ${isMe?'me':''}">
      <div class="rank-col">${u.rank==1?'👑':'#'+u.rank}</div>
      <div class="name-col">${isMe ? "YOU" : maskEmail(u.email)}</div>
      <div class="level-col">${getLevel(u.points)}</div>
      <div class="points-col">${u.points.toLocaleString()}</div>
    </div>`;
  }).join("");

  // nếu YOU không nằm trong top 3 → show riêng
  if(me && !list.slice(0,3).some(u => u.userId === currentUserId)){
    html += `
    <div style="text-align:center;color:#ccc;margin:10px;">•••</div>
    <div class="row me">
      <div class="rank-col">#${me.rank}</div>
      <div class="name-col">YOU</div>
      <div class="level-col">${getLevel(me.points)}</div>
      <div class="points-col">${me.points.toLocaleString()}</div>
    </div>`;
  }

  document.getElementById("list").innerHTML = html;
}

function maskEmail(email){
  if(!email) return "";
  const [n,d] = email.split("@");
  return n.slice(0,2) + "***@" + d;
}

function getLevel(points){
  if(points>=150000) return 7;
  if(points>=50000) return 6;
  if(points>=25000) return 5;
  if(points>=10000) return 4;
  if(points>=5000) return 3;
  if(points>=2000) return 2;
  if(points>=1000) return 1;
  return 0;
}
</script>

</body>
</html>
