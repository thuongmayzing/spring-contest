<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1e2447;
    --accent: #f4c542;
    --bg: #f7f8fc;
    --text-muted: #999;
  }
  
  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; 
    background: var(--bg); 
    display: flex; 
    justify-content: center; 
    align-items: center;
    min-height: 100vh; 
  }
  
  .container { 
    max-width: 480px; 
    width: 92%; 
    background: white; 
    border-radius: 24px; 
    overflow: hidden; 
    box-shadow: 0 12px 40px rgba(0,0,0,0.08); 
  }

  .login-box { 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    padding: 80px 20px; 
    gap: 15px; 
    text-align: center; 
  }

  .login-box h2 { 
    color: var(--primary); 
    margin: 0 0 10px; 
    font-weight: 800; 
    font-size: 26px; 
    text-transform: uppercase; 
  }

  .login-box input { 
    padding: 15px; 
    border-radius: 12px; 
    border: 1px solid #ddd; 
    width: 85%; 
  }

  .login-box button { 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: 12px; 
    padding: 15px; 
    width: 92%;
    cursor: pointer;
  }

  .header { 
    background: var(--primary); 
    color: white; 
    text-align: center; 
    padding: 45px 20px 35px; 
  }

  .content { padding: 30px 12px; }

  .table-header { 
    display: grid; 
    grid-template-columns: 45px 1.2fr 60px 80px; 
    padding: 0 15px 12px; 
    font-size: 10px; 
    font-weight: 800; 
    color: var(--text-muted); 
  }

  .list-container { display: flex; flex-direction: column; gap: 10px; }

  .row { 
    display: grid; 
    grid-template-columns: 45px 1.2fr 60px 80px; 
    padding: 18px 15px; 
    align-items: center; 
    background: #fff; 
    border-radius: 16px; 
    font-size: 13px; 
    border: 1px solid #f2f2f2; 
  }

  .row.top1 { background: #fffdf2; border-color: var(--accent); }
  .row.me { background: #eff2ff; border-color: #3d4da0; border-style: dashed; }

  .rank-col { text-align: center; font-weight: 800; }
  .points-col { text-align: right; font-weight: 700; }

  #list-wrapper { display: none; }
  .loading { text-align:center; padding:20px; color:#999; }
</style>
</head>

<body>

<div class="container">
  <div class="login-box" id="login">
    <h2>Leaderboard</h2>
    <input type="text" id="userIdInput" placeholder="Enter your userID">
    <button onclick="start()">View Rankings</button>
  </div>

  <div id="list-wrapper">
    <div class="header">
      <h1>LEADERBOARD</h1>
    </div>

    <div class="content">
      <div class="table-header">
        <div>Rank</div>
        <div>Participant</div>
        <div>Level</div>
        <div>Points</div>
      </div>

      <div id="list" class="list-container">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbxwagtl9ixLLROzldcbOHtP1-0qPR5trQq6Pa6oPpAzZ838uRZMA8ugp9DnG2ivo90g/exec";

// ✅ EMAIL WHITELIST PASS
const ACCESS_EMAIL = "xngbusiness@gmail.com";

let currentUserId = "";

const LEVELS = [
  { points: 1000 }, { points: 2000 }, { points: 5000 },
  { points: 10000 }, { points: 25000 }, { points: 50000 }
];

function maskEmail(email){
  if(!email) return "";
  const [n,d] = email.split("@");
  return n.slice(0,2) + "***@" + d;
}

function getLevel(points){
  let level = 0;
  LEVELS.forEach((l,i)=>{ if(points>=l.points) level=i+1 });
  return level;
}

function start(){
  const userId = document.getElementById("userIdInput").value.trim();
  if(!userId) return alert("Enter userID");

  currentUserId = userId;
  document.getElementById("login").style.display = "none";
  document.getElementById("list-wrapper").style.display = "block";

  loadLeaderboard();
}

function loadLeaderboard(){
  const url = `${apiUrl}?email=${encodeURIComponent(ACCESS_EMAIL)}&id=${encodeURIComponent(currentUserId)}`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if(data.error){
        document.getElementById("list").innerHTML =
          `<div style="color:red;text-align:center;">${data.error}</div>`;
        return;
      }
      renderLeaderboard(data);
    })
    .catch(err => {
      console.error(err);
      document.getElementById("list").innerHTML =
        `<div style="color:red;text-align:center;">API ERROR</div>`;
    });
}

function renderLeaderboard(data){
  const leaderboard = data.leaderboard || [];

  if(leaderboard.length === 0){
    document.getElementById("list").innerHTML =
      `<div class="loading">No data</div>`;
    return;
  }

  let html = leaderboard.map(u => {
    const isMe = u.userId === currentUserId;

    return `
      <div class="row ${isMe?'me':''} ${u.rank===1?'top1':''}">
        <div class="rank-col">${u.rank===1?'👑':'#'+u.rank}</div>
        <div>${isMe?'YOU':maskEmail(u.email)}</div>
        <div>${getLevel(u.points)}</div>
        <div class="points-col">${u.points.toLocaleString()}</div>
      </div>
    `;
  }).join("");

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
