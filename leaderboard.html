<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1e2447;
    --accent: #f4c542;
    --bg: #f7f8fc;
    --text-muted: #999;
  }
  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; 
    background: var(--bg); 
    display: flex; 
    justify-content: center; 
    align-items: center;
    min-height: 100vh; 
  }
  .container { 
    max-width: 480px; 
    width: 92%; 
    background: white; 
    border-radius: 24px; 
    overflow: hidden; 
    box-shadow: 0 12px 40px rgba(0,0,0,0.08); 
  }

  .login-box { 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    padding: 80px 20px; 
    gap: 15px; 
    text-align: center; 
  }
  .login-box h2 { color: var(--primary); margin: 0 0 10px; font-weight: 800; font-size: 26px; text-transform: uppercase; }
  .login-box input { padding: 15px; border-radius: 12px; border: 1px solid #ddd; width: 85%; font-size: 15px; }
  .login-box button { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 15px; font-weight: 700; cursor: pointer; width: 92%; }

  .header { background: var(--primary); color: white; text-align: center; padding: 45px 20px 35px; }
  .header .contest-name { font-size: 14px; opacity: 0.8; text-transform: uppercase; }
  .header h1 { margin: 0; font-size: 32px; font-weight: 800; }

  .content { padding: 30px 12px; }

  .table-header { 
    display: grid; 
    grid-template-columns: 45px 1.2fr 60px 80px; 
    padding: 0 15px 12px; 
    font-size: 10px; 
    font-weight: 800; 
    color: var(--text-muted); 
    text-transform: uppercase;
  }

  .list-container { display: flex; flex-direction: column; gap: 10px; }

  .row { 
    display: grid; 
    grid-template-columns: 45px 1.2fr 60px 80px; 
    padding: 18px 15px; 
    align-items: center; 
    border-radius: 16px; 
    border: 1px solid #f2f2f2;
  }

  .row.top1 { background: #fffdf2; border-color: var(--accent); }
  .row.me { background: #eff2ff; border-style: dashed; }

  .rank-col { text-align: center; font-weight: 800; }
  .name-col { overflow: hidden; text-overflow: ellipsis; }
  .level-col { text-align: center; color: #2ecc71; }
  .points-col { text-align: right; font-weight: 700; color: var(--primary); }

  #list-wrapper { display: none; }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="container">
  <div class="login-box" id="login">
    <span style="font-size:40px;">🏆</span>
    <h2>Leaderboard</h2>
    <input type="text" id="userIdInput" placeholder="Enter your userID">
    <button onclick="start()">View Rankings</button>
  </div>

  <div id="list-wrapper">
    <div class="header">
      <span class="contest-name">Spring Contest</span>
      <h1>LEADERBOARD</h1>
    </div>

    <div class="content">
      <div class="table-header">
        <div>Rank</div>
        <div>Participant</div>
        <div style="text-align:center">Level</div>
        <div style="text-align:right">Points</div>
      </div>
      <div class="list-container" id="list">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbwQHZlinas13xJ3LgIDsvcYyff5DE9FJo2YodUxZxwHT5oPfoo-a-KgIvjnloTyBhu7cw/exec";

// ✅ EMAIL AUTH
const ACCESS_EMAIL = "xngbusiness@gmail.com";

let currentUserId = "";

const LEVELS = [1000,2000,5000,10000,25000,50000,150000];

function maskEmail(email){
  if(!email) return "";
  const [n,d] = email.split("@");
  return n.slice(0,2) + "***@" + d;
}

function getLevel(p){
  return LEVELS.filter(x => p >= x).length;
}

function start(){
  const id = document.getElementById("userIdInput").value.trim();
  if(!id) return alert("Enter userID");

  currentUserId = id;
  document.getElementById("login").style.display = "none";
  document.getElementById("list-wrapper").style.display = "block";

  loadLeaderboard();
}

function loadLeaderboard(){
  const url = `${apiUrl}?email=${encodeURIComponent(ACCESS_EMAIL)}&userId=${encodeURIComponent(currentUserId)}&callback=handleData`;

  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

window.handleData = function(data){
  if(!data || data.error){
    document.getElementById("list").innerHTML =
      `<div style="color:red;text-align:center;">${data?.error || "API error"}</div>`;
    return;
  }
  renderLeaderboard(data);
}

function renderLeaderboard(data){
  const list = document.getElementById("list");
  const users = data.leaderboard || [];

  if(users.length === 0){
    list.innerHTML = `<div class="loading">No data</div>`;
    return;
  }

  let html = users.map(u=>{
    const isMe = u.userId === currentUserId;
    return `
      <div class="row ${isMe ? 'me' : ''} ${u.rank===1?'top1':''}">
        <div class="rank-col">${u.rank===1?'👑':'#'+u.rank}</div>
        <div class="name-col">${isMe?'YOU':maskEmail(u.email)}</div>
        <div class="level-col">${getLevel(u.points)}</div>
        <div class="points-col">${u.points.toLocaleString()}</div>
      </div>
    `;
  }).join("");

  list.innerHTML = html;
}
</script>

</body>
</html>
