<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>

<style>
body { font-family: sans-serif; background:#f5f6fa; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:400px; background:white; padding:20px; border-radius:20px; }

input, button { width:100%; padding:12px; margin-top:10px; }
.row { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee; }
.me { background:#dfe6ff; font-weight:bold; }
.top1 { color:gold; }
</style>
</head>
<body>

<div class="container">
  <h2>Leaderboard</h2>

  <input id="userId" placeholder="Enter your ID">
  <button onclick="load()">View</button>

  <div id="list"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwuPcW-7G68Y3byEKC3E4z5_gcuRZMX-GRdPXa-5djsFUoWatCrRI9FvwUJOGNsXtmyeg/exec";

// 🔐 token (không dùng email nữa)
const TOKEN = "MY_SECRET_123";

function mask(email){
  if(!email) return "Unknown";
  const [n,d] = email.split("@");
  return n.slice(0,2)+"***@"+d;
}

async function load(){
  const id = document.getElementById("userId").value.trim();
  if(!id) return alert("Enter ID");

  document.getElementById("list").innerHTML = "Loading...";

  try{
    const res = await fetch(`${API}?token=${TOKEN}`);
    const data = await res.json();

    if(data.error){
      document.getElementById("list").innerHTML = data.error;
      return;
    }

    render(data.users, id);

  }catch(e){
    document.getElementById("list").innerHTML = "Error loading data";
  }
}

function render(users, currentId){
  let html = "";

  users.forEach(u=>{
    const isMe = u.userId === currentId;
    html += `
      <div class="row ${isMe?'me':''} ${u.rank===1?'top1':''}">
        <div>#${u.rank}</div>
        <div>${isMe ? "YOU" : mask(u.email)}</div>
        <div>${u.points}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
