<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyFczo1QUyXLDPLeui9xp9qhen4tMc2Ba-7ZCifCC0gLHrfjIQ4YZdQshTofEKsSzTUkA/exec";

// 🔐 EMAIL WHITELIST
const ACCESS_EMAIL = "xngbusiness@gmail.com";

let currentUserId = "";

const LEVELS = [
  { points: 1000 }, { points: 2000 }, { points: 5000 },
  { points: 10000 }, { points: 25000 }, { points: 50000 }, { points: 150000 }
];

function maskEmail(email){
  if(!email) return "";
  const [n,d] = email.split("@");
  return n.slice(0,2) + "***@" + d;
}

function getLevel(points) {
  let level = 0;
  for (let i = 0; i < LEVELS.length; i++) {
    if (points >= LEVELS[i].points) level = i + 1;
  }
  return level;
}

function start(){
  const userId = document.getElementById("userIdInput").value.trim();
  if(!userId) return alert("Enter userID");

  currentUserId = userId;

  document.getElementById("login").style.display = "none";
  document.getElementById("list-wrapper").style.display = "block";

  loadLeaderboard();
}

function loadLeaderboard(){
  // ✅ GỌI API ĐÚNG FORMAT MỚI
  const url = `${apiUrl}?email=${encodeURIComponent(ACCESS_EMAIL)}&id=${encodeURIComponent(currentUserId)}&callback=handleData`;

  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

window.handleData = function(data){
  if(data.error){
    document.getElementById("list").innerHTML = `<div style="color:red; text-align:center;">${data.error}</div>`;
    return;
  }
  renderLeaderboard(data);
}

function renderLeaderboard(data){
  const leaderboard = data.leaderboard || [];

  let html = leaderboard.map(u => {
    const isMe = (
      u.userId === currentUserId ||
      u.email === currentUserId ||
      u.email === ACCESS_EMAIL
    );

    return `
      <div class="row ${isMe ? 'me' : ''} ${u.rank === 1 ? 'top1' : ''}">
        <div class="rank-col">${u.rank === 1 ? '👑' : '#' + u.rank}</div>
        <div class="name-col">${isMe ? "YOU" : maskEmail(u.email)}</div>
        <div class="level-col">${getLevel(u.points)}</div>
        <div class="points-col">${(u.points || 0).toLocaleString()}</div>
      </div>
    `;
  }).join("");

  if(!leaderboard.some(u => u.email === ACCESS_EMAIL) && data.rank){
    html += `
      <div style="text-align:center; color:#ccc; margin: 10px 0; font-size:12px;">•••</div>
      <div class="row me">
        <div class="rank-col">#${data.rank}</div>
        <div class="name-col">YOU</div>
        <div class="level-col">${getLevel(data.points)}</div>
        <div class="points-col">${(data.points || 0).toLocaleString()}</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}
</script>
