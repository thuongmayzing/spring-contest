<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #1e2447;
  --accent: #f4c542;
  --bg: #f7f8fc;
  --text-muted: #999;
}

body {
  font-family: 'Montserrat', sans-serif;
  margin: 0;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  max-width: 480px;
  width: 92%;
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}

/* LOGIN */
.login-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 20px;
  gap: 15px;
}

.login-box h2 {
  color: var(--primary);
  font-weight: 800;
}

.login-box input {
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #ddd;
  width: 85%;
}

.login-box button {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 15px;
  width: 92%;
  cursor: pointer;
}

/* HEADER */
.header {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 40px 20px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

/* TABLE */
.content { padding: 20px; }

.table-header, .row {
  display: grid;
  grid-template-columns: 45px 1.2fr 60px 80px;
  align-items: center;
}

.table-header {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* ROW */
.row {
  padding: 16px;
  border-radius: 16px;
  border: 1px solid #eee;
  margin-bottom: 10px;
  background: #fff;
  
  /* animation */
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.5s ease forwards;
}

.row:nth-child(1){ animation-delay: 0.05s }
.row:nth-child(2){ animation-delay: 0.1s }
.row:nth-child(3){ animation-delay: 0.15s }
.row:nth-child(4){ animation-delay: 0.2s }

/* TOP 1 */
.row.top1 {
  background: #fffdf2;
  border: 2px solid var(--accent);
  box-shadow: 0 0 12px rgba(244,197,66,0.4);
}

/* YOU */
.row.me {
  background: linear-gradient(135deg, #eef2ff, #dfe6ff);
  border: 2px dashed #4c5bd4;
  transform: scale(1.02);
  box-shadow: 0 6px 20px rgba(76,91,212,0.2);
}

/* ALIGN */
.rank-col { justify-self: center; font-weight: 800; }
.name-col { justify-self: start; }
.level-col { justify-self: center; color: #2ecc71; font-weight: 700; }
.points-col { justify-self: end; font-weight: 700; }

/* ANIMATION */
@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#list-wrapper { display:none }
</style>
</head>

<body>

<div class="container">

<div class="login-box" id="login">
  <h2>Leaderboard</h2>
  <input id="userIdInput" placeholder="Enter your userID">
  <button onclick="start()">View</button>
</div>

<div id="list-wrapper">

<div class="header">
  <h1>LEADERBOARD</h1>
</div>

<div class="content">

<div class="table-header">
  <div>Rank</div>
  <div>Participant</div>
  <div>Level</div>
  <div>Points</div>
</div>

<div id="list"></div>

</div>
</div>
</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyFczo1QUyXLDPLeui9xp9qhen4tMc2Ba-7ZCifCC0gLHrfjIQ4YZdQshTofEKsSzTUkA/exec";

const ACCESS_EMAIL = "xngbusiness@gmail.com";
let currentUserId = "";

function start(){
  const val = document.getElementById("userIdInput").value.trim();
  if(!val) return alert("Enter ID");
  
  currentUserId = val;
  document.getElementById("login").style.display="none";
  document.getElementById("list-wrapper").style.display="block";
  load();
}

function load(){
  const url = `${apiUrl}?email=${ACCESS_EMAIL}&id=${currentUserId}&callback=handle`;
  const s = document.createElement("script");
  s.src = url;
  document.body.appendChild(s);
}

window.handle = function(data){
  if(data.error){
    document.getElementById("list").innerHTML = data.error;
    return;
  }

  const list = data.leaderboard;
  
  let html = list.slice(0,3).map(u=>{
    const me = u.userId === currentUserId;
    return `
    <div class="row ${u.rank==1?'top1':''} ${me?'me':''}">
      <div class="rank-col">${u.rank==1?'👑':'#'+u.rank}</div>
      <div class="name-col">${me?'YOU':mask(u.email)}</div>
      <div class="level-col">${level(u.points)}</div>
      <div class="points-col">${u.points.toLocaleString()}</div>
    </div>`;
  }).join("");

  const me = data.currentUser;

  if(me){
    html += `
    <div style="text-align:center;color:#bbb;margin:10px;">•••</div>
    <div class="row me">
      <div class="rank-col">#${me.rank}</div>
      <div class="name-col">YOU</div>
      <div class="level-col">${level(me.points)}</div>
      <div class="points-col">${me.points.toLocaleString()}</div>
    </div>`;
  }

  document.getElementById("list").innerHTML = html;
}

function mask(e){
  const [n,d]=e.split("@");
  return n.slice(0,2)+"***@"+d;
}

function level(p){
  if(p>=150000) return 7;
  if(p>=50000) return 6;
  if(p>=25000) return 5;
  if(p>=10000) return 4;
  if(p>=5000) return 3;
  if(p>=2000) return 2;
  if(p>=1000) return 1;
  return 0;
}
</script>

</body>
</html>
