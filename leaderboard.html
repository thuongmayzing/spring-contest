<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #1e2447;
  --accent: #f4c542;
  --bg: #f7f8fc;
}

body { 
  font-family: 'Montserrat', sans-serif; 
  margin: 0; 
  background: var(--bg); 
  display: flex; 
  justify-content: center; 
  align-items: center;
  min-height: 100vh; 
}

.container { 
  max-width: 480px; 
  width: 92%; 
  background: white; 
  border-radius: 28px; 
  overflow: hidden; 
  box-shadow: 0 16px 50px rgba(0,0,0,0.08); 
}

/* LOGIN */
.login-box { 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  padding: 90px 24px; 
  gap: 16px; 
  text-align: center; 
}
.login-box h2 { color: var(--primary); font-weight: 800; font-size: 24px; }
.login-box input { 
  padding: 16px; 
  border-radius: 14px; 
  border: 1px solid #ddd; 
  width: 100%; 
  max-width: 300px;
}
.login-box button { 
  background: var(--primary); 
  color: white; 
  border: none; 
  border-radius: 14px; 
  padding: 16px; 
  width: 100%; 
  max-width: 300px;
  font-weight: 700;
}

/* HEADER */
.header { 
  background: var(--primary); 
  color: white; 
  text-align: center; 
  padding: 48px 20px 36px; 
}
.header h1 { 
  margin: 0; 
  font-size: 30px; 
  letter-spacing: 2px;
}

/* CONTENT */
.content { padding: 28px 16px; }

/* GRID */
.table-header, .row {
  display: grid;
  grid-template-columns: 48px 1fr 70px 90px;
  align-items: center;
}

/* HEADER TEXT */
.table-header {
  font-size: 12px;
  font-weight: 700;
  color: #888;
  padding: 0 12px 18px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.table-header div:nth-child(1) { text-align: center; }
.table-header div:nth-child(3) { text-align: center; }
.table-header div:nth-child(4) { text-align: right; }

/* ROW */
.row {
  padding: 20px 14px;
  border-radius: 18px;
  border: 1px solid #f1f1f1;
  margin-bottom: 12px;
  background: #fff;
  transition: all 0.25s ease;
}

/* TOP 1 */
.row.top1 {
  background: #fffdf2;
  border: 1.5px solid var(--accent);
  box-shadow: 0 6px 18px rgba(244,197,66,0.15);
}

/* YOU */
@keyframes pulseYou {
  0% { box-shadow: 0 0 0 0 rgba(61,77,160,0.15); }
  70% { box-shadow: 0 0 0 10px rgba(61,77,160,0); }
  100% { box-shadow: 0 0 0 0 rgba(61,77,160,0); }
}

.row.me {
  background: #eef2ff;
  border: 2px dashed #3d4da0;
  font-weight: 800;
  transform: scale(1.01);
  animation: pulseYou 2.2s infinite;
}

/* COLUMNS */
.rank-col { 
  justify-self: center; 
  font-weight: 800; 
  font-size: 15px;
}

/* 👇 FIX CHÍNH Ở ĐÂY */
.name-col { 
  justify-self: start; 
  font-weight: 600;
  padding-left: 22px;   /* đẩy ra rõ ràng */
  font-size: 14px;
}

.level-col { 
  justify-self: center; 
  color: #2ecc71; 
  font-weight: 700; 
  font-size: 15px;
}

.points-col { 
  justify-self: end; 
  font-weight: 800; 
  font-size: 15px;
}

/* DIVIDER */
.divider {
  text-align:center;
  color:#ccc;
  margin: 16px 0;
  font-size: 14px;
}

#list-wrapper { display: none; }
.loading { text-align:center; padding:40px; color:#999; }

</style>
</head>

<body>

<div class="container">

<div class="login-box" id="login">
  <h2>Leaderboard</h2>
  <input type="text" id="userIdInput" placeholder="Enter your userID">
  <button onclick="start()">View Rankings</button>
</div>

<div id="list-wrapper">
  <div class="header">
    <h1>LEADERBOARD</h1>
  </div>

  <div class="content">

    <div class="table-header">
      <div>Rank</div>
      <div>Participant</div>
      <div>Level</div>
      <div>Points</div>
    </div>

    <div id="list">
      <div class="loading">Loading...</div>
    </div>

  </div>
</div>

</div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbwQHZlinas13xJ3LgIDsvcYyff5DE9FJo2YodUxZxwHT5oPfoo-a-KgIvjnloTyBhu7cw/exec";

const ACCESS_EMAIL = "xngbusiness@gmail.com";
let currentUserId = "";

function start(){
  const userId = document.getElementById("userIdInput").value.trim();
  if(!userId) return alert("Enter userID");

  currentUserId = userId;
  document.getElementById("login").style.display = "none";
  document.getElementById("list-wrapper").style.display = "block";
  loadLeaderboard();
}

function loadLeaderboard(){
  const url = `${apiUrl}?email=${encodeURIComponent(ACCESS_EMAIL)}&callback=handleData`;
  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

window.handleData = function(data){
  if(data.error){
    document.getElementById("list").innerHTML = `<div style="color:red;text-align:center">${data.error}</div>`;
    return;
  }

  const list = data.leaderboard || [];
  const me = list.find(u => u.userId === currentUserId);

  // 🔥 TOP 5
  let html = list.slice(0,5).map(u => {
    const isMe = u.userId === currentUserId;

    return `
    <div class="row ${u.rank==1?'top1':''} ${isMe?'me':''}">
      <div class="rank-col">${u.rank==1?'👑':'#'+u.rank}</div>
      <div class="name-col">${isMe ? "YOU" : maskEmail(u.email)}</div>
      <div class="level-col">${getLevel(u.points)}</div>
      <div class="points-col">${u.points.toLocaleString()}</div>
    </div>`;
  }).join("");

  // nếu YOU không nằm trong top 5
  if(me && !list.slice(0,5).some(u => u.userId === currentUserId)){
    html += `
    <div class="divider">•••</div>
    <div class="row me">
      <div class="rank-col">#${me.rank}</div>
      <div class="name-col">YOU</div>
      <div class="level-col">${getLevel(me.points)}</div>
      <div class="points-col">${me.points.toLocaleString()}</div>
    </div>`;
  }

  document.getElementById("list").innerHTML = html;
}

function maskEmail(email){
  if(!email) return "";
  const [n,d] = email.split("@");
  return n.slice(0,2) + "***@" + d;
}

function getLevel(points){
  if(points>=150000) return 7;
  if(points>=50000) return 6;
  if(points>=25000) return 5;
  if(points>=10000) return 4;
  if(points>=5000) return 3;
  if(points>=2000) return 2;
  if(points>=1000) return 1;
  return 0;
}
</script>

</body>
</html>
