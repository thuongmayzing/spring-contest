<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Contest 2026 - DLQ Team</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1e2447;
    --accent: #f4c542;
    --bg: #f7f8fc;
    --success: #2ecc71;
  }
  body { font-family: 'Montserrat', sans-serif; margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  
  .container { max-width: 480px; width: 92%; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 35px rgba(0,0,0,0.08); margin: 15px 0; }
  
  .header { background: var(--primary); color: white; text-align: center; padding: 30px 20px 20px; }
  .header h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; font-weight: 800; color: #fff; }
  .header p { opacity: 0.8; font-size: 13px; margin: 8px 0; color: #eee; font-weight: 500; }
  .level-badge { background: var(--accent); color: var(--primary); padding: 6px 24px; border-radius: 20px; font-weight: 800; font-size: 16px; display: inline-block; margin-top: 10px; box-shadow: 0 4px 10px rgba(244, 197, 66, 0.3); }

  .content { padding: 20px 15px; text-align: center; }

  .circle { width: 170px; height: 170px; border: 8px solid var(--accent); border-radius: 50%; margin: 0 auto 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; box-shadow: inset 0 0 15px rgba(0,0,0,0.05); }
  .circle .reward-label { font-size: 10px; text-transform: uppercase; color: #999; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 5px; }
  .circle .units { font-size: 20px; font-weight: 800; color: var(--primary); margin: 2px 0; }
  .circle .reward-val { font-size: 22px; font-weight: 800; color: var(--success); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
  .stat-box { background: #fff; padding: 12px 5px; border-radius: 12px; border: 1px solid #f0f0f0; transition: transform 0.2s; }
  .stat-box small { font-size: 10px; color: #aaa; text-transform: uppercase; display: block; font-weight: 700; margin-bottom: 5px; }
  .stat-box span { font-size: 15px; font-weight: 800; color: var(--primary); }

  .progress-wrapper { width: 95%; margin: 0 auto 25px; }
  .progress-container { background: #eee; border-radius: 20px; height: 26px; overflow: hidden; position: relative; }
  .progress-bar { 
    height: 100%; 
    background: linear-gradient(90deg, #1e2447, #4a5db3); 
    width: 0%; 
    transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .progress-bar-text { color: white; font-size: 11px; font-weight: 800; padding-right: 10px; }

  .table { width: 100%; border-collapse: separate; border-spacing: 0 6px; margin-top: 10px; }
  .row { display: grid; grid-template-columns: 35px 1.5fr 0.8fr 0.8fr 0.7fr; padding: 12px 8px; align-items: center; background: #fff; border-radius: 10px; font-size: 13px; border: 1px solid #f5f5f5; color: #444; }
  .row.header-row { background: none; border: none; font-weight: 700; color: #bbb; font-size: 10px; text-transform: uppercase; padding-bottom: 0; }
  
  .row.top-rank { 
    background: #fffef2; 
    border-color: var(--accent); 
    font-weight: 700; 
    color: var(--primary); 
    box-shadow: 0 4px 12px rgba(244, 197, 66, 0.15);
  }
  
  .crown-col { text-align: center; font-size: 16px; }
  .email-col { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contrib { font-size: 11px; color: #999; font-weight: 600; }

  #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:100; font-weight:700; color:var(--primary); }
</style>
</head>
<body>

<div id="loading-overlay">UPDATING TEAM DATA...</div>

<div class="container">
  <div class="header">
    <h1>DLQ TEAM</h1>
    <p>Spring Contest: 24 Mar - 24 Jun</p>
    <div id="level-tag" class="level-badge">LEVEL 0</div>
  </div>

  <div class="content">
    <div id="target-area">
      <div class="circle">
         <span class="reward-label">Next Reward</span>
         <span class="units" id="next-p">... Points</span>
         <span class="reward-val" id="next-r">...</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box"><small>Total Units</small><span id="team-units">0</span></div>
      <div class="stat-box"><small>Total Points</small><span id="team-points">0</span></div>
      <div class="stat-box"><small>Days Left</small><span id="days-left">0</span></div>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar">
          <span class="progress-bar-text" id="progress-val">0%</span>
        </div>
      </div>
    </div>

    <div class="table">
      <div class="row header-row">
        <div></div>
        <div style="text-align:left">Member</div>
        <div>Units</div>
        <div>Points</div>
        <div>%</div>
      </div>
      <div id="table-body"></div>
    </div>
  </div>
</div>

<script>
// URL trỏ trực tiếp đến tab DLQ
const apiUrl = "https://script.google.com/macros/s/AKfycbynbUNjQvYahFZ7kFAuelON1dAEb1EpadQgZY1WQgGJdbgqJLnA8oOZY78jKYNU-pF0uQ/exec?sheet=DLQ";

const LEVELS = [
  { p: 1000, r: "$200" }, { p: 2000, r: "$500" }, { p: 5000, r: "$1,500" },
  { p: 10000, r: "$3,500" }, { p: 25000, r: "$10,000" }, { p: 50000, r: "$25,000" }, { p: 150000, r: "$100,000" }
];

function maskEmail(email) {
  if(!email || !email.includes("@")) return "User";
  const parts = email.split("@");
  const name = parts[0];
  return name.length <= 4 ? name : name.slice(0, 2) + "**" + name.slice(-2);
}

function loadData() {
  const cb = "jsonp_cb_" + Date.now();
  window[cb] = (data) => {
    document.getElementById("loading-overlay").style.display = "none";
    render(data);
  };
  const s = document.createElement("script");
  s.src = `${apiUrl}&callback=${cb}`;
  document.body.appendChild(s);
}

function render(data) {
  if (data.error) return alert("Error: " + data.error);

  const users = data.users || [];
  const totalP = +data.totalPoints || 0;
  const totalU = +data.totalUnits || 0;
  users.sort((a,b) => b.points - a.points);

  // Stats & Timer
  document.getElementById("team-units").textContent = totalU.toLocaleString();
  document.getElementById("team-points").textContent = totalP.toLocaleString();
  const days = Math.max(0, Math.ceil((new Date("2026-06-24T23:59:59Z") - new Date()) / 864e5));
  document.getElementById("days-left").textContent = days;

  // Level & Next Reward
  let currentLvl = 0;
  LEVELS.forEach((l, idx) => { if(totalP >= l.p) currentLvl = idx + 1; });
  document.getElementById("level-tag").textContent = `LEVEL ${currentLvl}`;

  const nextLvl = LEVELS.find(l => l.p > totalP) || LEVELS[LEVELS.length-1];
  document.getElementById("next-p").textContent = nextLvl.p.toLocaleString() + " Points";
  document.getElementById("next-r").textContent = nextLvl.r;

  // Progress Bar (Tính dựa trên mốc level hiện tại đến mốc kế tiếp)
  const prevP = currentLvl === 0 ? 0 : LEVELS[currentLvl-1].p;
  const nextGoalP = nextLvl.p;
  let pct = (totalP >= LEVELS[LEVELS.length-1].p) ? 100 : ((totalP - prevP) / (nextGoalP - prevP)) * 100;
  pct = Math.min(100, Math.max(0, pct));
  
  const bar = document.getElementById("progress-bar");
  const valText = document.getElementById("progress-val");
  bar.style.width = pct + "%";
  valText.textContent = Math.floor(pct) + "%";
  valText.style.display = pct > 10 ? "block" : "none";

  // Table
  document.getElementById("table-body").innerHTML = users.map((u, i) => `
    <div class="row ${i === 0 && u.points > 0 ? 'top-rank' : ''}">
      <div class="crown-col">${i === 0 && u.points > 0 ? '👑' : ''}</div>
      <div class="email-col">${maskEmail(u.email)}</div>
      <div>${(u.units || 0).toLocaleString()}</div>
      <div>${(u.points || 0).toLocaleString()}</div>
      <div class="contrib">${totalP > 0 ? ((u.points/totalP)*100).toFixed(1) : 0}%</div>
    </div>
  `).join("");
}

loadData();
</script>
</body>
</html>
