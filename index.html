<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Individual Progress - Spring Contest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Giữ nguyên CSS của bạn */
  :root { --primary: #1e2447; --accent: #f4c542; --bg: #f7f8fc; --success: #2ecc71; }
  body { font-family: 'Montserrat', sans-serif; margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { max-width: 480px; width: 92%; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 35px rgba(0,0,0,0.08); margin: 20px 0; }
  .email-box { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px 20px; gap: 15px; }
  .email-box input { padding: 14px; border-radius: 12px; border: 1px solid #ddd; width: 80%; font-size: 15px; outline: none; }
  .email-box button { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 14px 30px; font-weight: 700; cursor: pointer; width: 85%; }
  .header { background: var(--primary); color: white; text-align: center; padding: 35px 20px 22px; }
  .header h1 { margin: 0; font-size: 28px; font-weight: 700; text-transform: uppercase; }
  .level-badge { background: var(--accent); color: var(--primary); padding: 5px 22px; border-radius: 20px; font-weight: 800; display: inline-block; margin-top: 10px; }
  .content { padding: 30px 15px 25px; text-align: center; }
  .circle { width: 185px; height: 185px; border: 8px solid var(--accent); border-radius: 50%; margin: 0 auto 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
  .circle .units { font-size: 24px; font-weight: 800; color: var(--primary); }
  .circle .reward { font-size: 19px; font-weight: 700; color: var(--success); }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
  .stat-box { background: #fff; padding: 12px 2px; border-radius: 12px; border: 1px solid #eee; }
  .stat-box span { font-size: 16px; font-weight: 800; color: var(--primary); }
  .progress-container { background: #eee; border-radius: 20px; height: 26px; overflow: hidden; width: 95%; margin: 0 auto; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #1e2447, #3d4da0); width: 0%; transition: width 0.8s ease; display: flex; align-items: center; justify-content: flex-end; }
  .progress-bar-text { color: white; font-size: 12px; font-weight: 800; padding-right: 10px; }
  .footer-info { display: flex; justify-content: space-between; width: 95%; margin: 15px auto; font-size: 12px; color: #777; font-weight: 700; }
  #widget { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="email-box" id="email-box">
    <h2 style="color: var(--primary);">Enter ID</h2>
    <input type="text" placeholder="Your User ID" id="userIdInput">
    <button onclick="loadWidget()">View My Progress</button>
  </div>

  <div id="widget">
    <div class="header">
      <h1>Spring Contest</h1>
      <p>24 Mar to 24 Jun (23:59 GMT)</p>
      <div class="level-badge" id="level-text">LEVEL 0</div>
    </div>
    <div class="content">
      <div class="circle">
        <span style="font-size:11px; color:#999; text-transform:uppercase;">Next Reward</span>
        <div class="units" id="next-goal">... Points</div>
        <div class="reward" id="next-reward">...</div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><small>Units</small><br><span id="stat-units">0</span></div>
        <div class="stat-box"><small>Points</small><br><span id="stat-points">0</span></div>
        <div class="stat-box"><small>Rank</small><br><span id="stat-rank">0</span></div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar">
          <span class="progress-bar-text" id="progress-pct">0%</span>
        </div>
      </div>
      <div class="footer-info">
        <div id="progress-text">0 / 0 points</div>
        <div id="time-left">⏰ Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
const apiUrl = "URL_WEB_APP_CUA_BAN"; // THAY URL SAU KHI DEPLOY

async function loadWidget() {
  const userId = document.getElementById("userIdInput").value.trim();
  if (!userId) return alert("Enter userID");
  document.getElementById("email-box").style.display = "none";
  document.getElementById("widget").style.display = "block";
  
  try {
    const res = await fetch(apiUrl + "?id=" + encodeURIComponent(userId));
    const data = await res.json();
    if (data.error) { alert("User not found"); location.reload(); return; }
    renderData(data);
  } catch (err) { console.error(err); }
}

function renderData(data) {
  const points = +data.points || 0;
  const levels = [
    { points: 1000, reward: "$200" }, { points: 2000, reward: "$500" },
    { points: 5000, reward: "$1,500" }, { points: 10000, reward: "$3,500" },
    { points: 25000, reward: "$10,000" }, { points: 50000, reward: "$25,000" },
    { points: 150000, reward: "$100,000" }
  ];

  let currentLevel = 0;
  levels.forEach((l, i) => { if (points >= l.points) currentLevel = i + 1; });
  document.getElementById("level-text").textContent = `LEVEL ${currentLevel}`;

  const nextL = levels.find(l => l.points > points) || levels[levels.length-1];
  document.getElementById("next-goal").textContent = nextL.points.toLocaleString() + " Points";
  document.getElementById("next-reward").textContent = nextL.reward;
  document.getElementById("stat-units").textContent = (+data.units).toLocaleString();
  document.getElementById("stat-points").textContent = points.toLocaleString();
  document.getElementById("stat-rank").textContent = "#" + (data.rank <= 3 ? 3 : data.rank);

  // 🔥 SỬA LỖI 15%: Tính % dựa trên tổng điểm của mốc tiếp theo
  const pct = Math.max(0, Math.min(100, (points / nextL.points) * 100));
  
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-pct").textContent = Math.floor(pct) + "%";
  document.getElementById("progress-text").textContent = `${points.toLocaleString()} / ${nextL.points.toLocaleString()} points`;
}

function updateTimer() {
  const diff = new Date("2026-06-24T23:59:59Z") - new Date();
  if (diff <= 0) return document.getElementById("time-left").textContent = "Ended";
  const d = Math.floor(diff / 864e5), h = Math.floor((diff / 36e5) % 24), m = Math.floor((diff / 6e4) % 60);
  document.getElementById("time-left").textContent = `⏰ ${d}d ${h}h ${m}m`;
}
setInterval(updateTimer, 1000); updateTimer();
</script>
</body>
</html>
